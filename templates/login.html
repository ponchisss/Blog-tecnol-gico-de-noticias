{% extends 'base.html' %}

{% block title %}Iniciar Sesión - TECHLOG{% endblock %}

{% block content %}
<div class="form-card" id="login-form-card">
    <header class="form-header">
        <h2 class="form-title" id="login-title">Iniciar Sesión</h2>
        <p class="form-subtitle" id="login-subtitle">Introduce tus credenciales para acceder a la plataforma</p>
    </header>

    <form action="{{ url_for('login') }}" method="POST" id="login-submit-form">
        <div class="form-group">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="nombre@correo.com" required autocomplete="email">
        </div>
        
        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.8rem; border-radius: 8px; font-weight: 700; cursor: pointer; border:none;" id="login-btn-submit">Entrar</button>
    </form>

    <footer class="form-footer" id="login-footer">
        <p>¿No tienes una cuenta? <a href="{{ url_for('register') }}" id="go-to-register">Regístrate aquí</a></p>
        <p style="font-size:0.75rem; color:var(--accent-teal); margin-top:1.5rem; border-top:1px solid rgba(255,255,255,0.05); padding-top:1rem;">
            Cuenta Demo Admin:<br><strong>admin@techblog.com</strong> / <strong>AdminPass123!</strong>
        </p>
    </footer>
</div>
{% endblock %}
